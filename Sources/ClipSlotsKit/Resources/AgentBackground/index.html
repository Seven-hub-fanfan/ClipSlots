<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self' file:; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
html[data-appearance="light"],html[data-appearance="light"] body{background:#fff}
/* The sidebar is a movable crop of a fixed 2:3 portrait, never a zoom control. */
video{display:block;position:absolute;left:50%;top:50%;width:440px;height:660px;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;opacity:1}
html[data-appearance="light"] video{filter:invert(1) hue-rotate(180deg);opacity:1}
</style>
<video id="portrait" muted loop playsinline preload="auto" aria-label="ASCII 人像动态背景"></video>
<script>
const video=document.getElementById('portrait');
let requested=false;
function synchronize(){
  if(requested&&!document.hidden)video.play().catch(()=>{});
  else video.pause();
}
window.setPlayback=value=>{requested=!!value;synchronize()};
window.setTheme=light=>{
  document.documentElement.dataset.appearance=light?'light':'dark';
  const source=light?'ascii-portrait-light.webm':'ascii-portrait.webm';
  if(video.getAttribute('src')!==source){
    video.poster=light?'poster-light.png':'poster.png';
    video.src=source;
    video.load();
  }
};
document.addEventListener('visibilitychange',synchronize);
video.addEventListener('canplay',synchronize);
</script>
</html>
